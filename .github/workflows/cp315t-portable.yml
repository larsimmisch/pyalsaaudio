name: CPython 3.15t ordinary default and PCM lifetime
on:
  push:
    branches: [stablekite/nogil-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.15t'
      - name: Standard distribution SDK for the original ARM source backend
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Ordinary default-branch pip installation
        run: python -m pip install git+https://github.com/StableKite/pyalsaaudio.git mypy==2.1.0 pyright==1.1.414
      - name: Actual SDK, PEP610, RECORD, native threads and lifetime tests
        run: python -I -u ci/check_cp315t_portable.py
      - name: Every production Python and stub file, strict Pyright
        run: python -m pyright --project pyrightconfig.strict.json
      - name: Actual installed public stub contract
        run: python -m mypy.stubtest alsaaudio
      - run: python -m pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-pyalsaaudio-${{ matrix.os }}
          path: pyalsaaudio-ci-evidence/
